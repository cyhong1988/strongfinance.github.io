<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人投資戰略系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field { background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: white; padding: 6px 10px; border-radius: 6px; width: 100%; font-size: 0.875rem; }
        .input-readonly { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(51, 65, 85, 0.3); color: #94a3b8; cursor: not-allowed; }
        .input-target { background: transparent; border-bottom: 1px dashed #475569; color: #94a3b8; width: 90px; text-align: center; font-family: monospace; }
        .input-target:focus { outline: none; border-color: #60a5fa; color: white; }
        .btn-delete { color: #ef4444; cursor: pointer; transition: opacity 0.2s; padding: 0 8px; }
        .drag-handle { cursor: grab; color: #475569; font-size: 1.2rem; user-select: none; padding-right: 8px; }
        
        .btn-save { 
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.4); 
            color: #60a5fa; 
            padding: 6px 24px; 
            border-radius: 99px; 
            font-size: 0.75rem; 
            letter-spacing: 0.2em;
            transition: all 0.3s; 
            margin-top: 12px;
            font-weight: 600;
        }
        .btn-save:hover { 
            background: rgba(59, 130, 246, 0.2); 
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .btn-quick-add { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; transition: all 0.2s; margin-top: 6px; }
        .btn-quick-add:hover { background: rgba(59, 130, 246, 0.2); color: white; }
        .profit { color: #10b981; } 
        .loss { color: #f43f5e; }   

        .fx-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 16px;
        }

        .history-item {
            border-left: 2px solid rgba(96, 165, 250, 0.3);
            padding-left: 12px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }
        .history-item:first-child {
            border-left-color: #60a5fa;
            background: rgba(96, 165, 250, 0.05);
            padding: 6px 12px;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body class="gradient-bg text-slate-200 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start mb-6 border-b border-white/10 pb-8 gap-8">
            <div class="flex-1 w-full">
                <h1 class="text-2xl font-light tracking-[0.3em] text-white">個人投資戰略系統</h1>
                <div class="flex items-center gap-2 mt-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <p id="sync-status" class="text-slate-500 text-[10px] tracking-widest uppercase font-semibold">系統連線中</p>
                </div>
                
                <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="card p-4 rounded-xl">
                        <span class="text-[10px] text-slate-500 uppercase tracking-[0.2em] font-bold block mb-4 border-b border-white/5 pb-2">資產歷史紀錄 (最近 10 筆)</span>
                        <div id="history-list" class="space-y-3 max-h-[180px] overflow-y-auto pr-2 custom-scrollbar">
                            <span class="text-slate-600 text-[10px] italic">等待資料載入...</span>
                        </div>
                    </div>

                    <div class="card p-4 rounded-xl flex flex-col justify-between border-t-2 border-amber-500/40">
                        <div>
                            <span class="text-[10px] text-amber-500 uppercase tracking-[0.2em] font-bold block mb-4 border-b border-white/5 pb-2">資產歷史新高紀錄</span>
                            <div id="high-record-display" class="flex flex-col justify-center min-h-[60px] py-2">
                                <span class="text-slate-600 text-[10px] italic">計算中...</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col justify-center items-center md:items-start px-4">
                        <div class="fx-tag flex flex-col items-center min-w-[160px]">
                            <span class="text-[10px] text-slate-500 tracking-[0.2em] uppercase mb-1 font-bold">即時匯率參考</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-blue-400 font-bold">USD/TWD</span>
                                <span id="fx-rate-display" class="text-lg font-mono text-white font-medium">--.--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center md:items-end w-full">
                <span class="text-slate-500 text-[10px] uppercase tracking-[0.2em] mb-1 font-bold">當前總資產預估</span>
                <div class="flex items-baseline gap-2">
                    <span class="text-sm text-slate-400 font-mono">TWD</span>
                    <div id="total-assets-display" class="text-4xl font-mono font-bold text-white tracking-tighter">--</div>
                </div>
                <div id="diff-display" class="text-sm font-mono mt-1 font-bold">--</div>
                
                <div class="flex flex-col items-center md:items-end mt-4">
                    <button onclick="saveData()" class="btn-save uppercase">儲存當前狀態</button>
                    <div id="last-save-time" class="text-[9px] text-slate-600 mt-2 tracking-widest font-mono">最後更新時間: 更新中⋯</div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="card p-6 rounded-2xl border-t-2 border-red-500/50 shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xs font-bold text-slate-400 tracking-widest uppercase">現金流清單</h2>
                        <button onclick="addRow('expense')" class="text-[10px] text-slate-500 hover:text-white transition">+ 新增項目</button>
                    </div>
                    <div class="space-y-3 mb-6">
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-1 uppercase tracking-wider">每月固定收入</label>
                            <input type="number" id="input-income" class="input-field border-emerald-900/30 font-mono text-emerald-400" placeholder="請輸入金額" oninput="calculate()">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-1 uppercase tracking-wider">每月固定支出 (自動加總)</label>
                            <input type="text" id="display-total-expense" class="input-field input-readonly font-mono text-red-400/80" placeholder="--" readonly>
                        </div>
                    </div>
                    <div id="expense-list" class="space-y-2 min-h-[50px]"></div>
                    <div class="mt-8 pt-4 border-t border-white/5">
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-slate-500 text-[10px] uppercase tracking-wider">每月收支報告</span>
                                <div id="monthly-gap-display" class="text-2xl font-mono font-bold">--</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-6 rounded-2xl border-t-2 border-slate-500/50">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xs font-bold text-slate-400 tracking-widest uppercase">目前出國旅遊支出</h2>
                        <span class="text-[9px] text-slate-500 uppercase tracking-tighter">僅紀錄</span>
                    </div>
                    <input type="number" id="input-travel" class="input-field font-mono text-lg text-slate-400" placeholder="請輸入金額" oninput="calculate()">
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="card p-6 rounded-2xl">
                        <div class="flex justify-between items-center mb-4">
                            <label class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">流動現金總額 (自動加總)</label>
                            <button onclick="addRow('bank')" class="text-[9px] bg-white/5 px-2 py-1 rounded hover:bg-white/10">+ 新增銀行</button>
                        </div>
                        <input type="text" id="input-cash" class="input-field input-readonly text-2xl font-mono text-emerald-400/90 mb-4" placeholder="--" readonly>
                        <div id="bank-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1"></div>
                    </div>
                    <div class="card p-6 rounded-2xl flex flex-col justify-between">
                        <div>
                            <label class="text-[10px] text-slate-500 uppercase tracking-widest block mb-2 font-bold">尚餘加碼彈藥</label>
                            <input type="number" id="input-ammo" class="input-field text-xl font-mono text-amber-400/90" placeholder="請輸入金額" oninput="calculate()">
                        </div>
                    </div>
                </div>

                <div class="card p-8 rounded-2xl shadow-2xl">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-10">資產建倉進度與實時損益</h2>
                    <div class="space-y-14">
                        <div class="space-y-4">
                            <div class="flex flex-wrap justify-between items-end border-b border-white/5 pb-3 gap-y-4">
                                <span class="text-sm font-bold text-blue-400 tracking-widest flex items-center gap-2 min-w-[180px]">
                                    美股配置目標
                                    <input type="number" id="target-us" class="input-target" value="2800000" oninput="calculate()">
                                </span>
                                <div class="flex gap-4 items-center flex-grow justify-end">
                                    <div class="text-right">
                                        <label class="text-[10px] text-slate-500 uppercase block font-bold mb-1">損益 (USD)</label>
                                        <input type="number" id="pnl-us-usd" class="input-field input-readonly w-24 font-mono text-right text-sm" placeholder="--" step="0.01" readonly>
                                    </div>
                                    <div class="text-right">
                                        <label class="text-[10px] text-slate-500 uppercase block font-bold mb-1">損益 (TWD)</label>
                                        <input type="text" id="pnl-us-twd-val" class="input-field input-readonly w-28 font-mono text-right text-sm" placeholder="--" readonly>
                                    </div>
                                    <div class="text-right border-l border-white/10 pl-4 min-w-[110px]">
                                        <label class="text-[10px] text-slate-500 uppercase block font-bold mb-1">美股總市值 (TWD)</label>
                                        <div id="pnl-us-twd-display" class="text-lg font-mono font-bold leading-tight">--</div>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                                <div>
                                    <label class="text-[10px] text-slate-500 mb-1 block uppercase font-bold">美股配置金額 (USD 本金)</label>
                                    <input type="number" id="input-us-principal-usd" class="input-field font-mono text-blue-400" placeholder="本金" oninput="calculateWithMarketValue()">
                                </div>
                                <div>
                                    <label class="text-[10px] text-amber-500 mb-1 block uppercase font-bold">美股目前市值 (USD)</label>
                                    <input type="number" id="input-us-market-usd" class="input-field font-mono border-amber-500/30 text-amber-400" placeholder="輸入目前市值" oninput="calculateWithMarketValue()">
                                </div>
                            </div>
                            <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden mt-2">
                                <div id="bar-us" class="bg-blue-500 h-full transition-all duration-1000" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div class="flex flex-wrap justify-between items-end border-b border-white/5 pb-3 gap-y-4">
                                <span class="text-sm font-bold text-purple-400 tracking-widest flex items-center gap-2 min-w-[180px]">
                                    台股配置目標
                                    <input type="number" id="target-tw" class="input-target" value="3990000" oninput="calculate()">
                                </span>
                                <div class="text-right flex-grow flex justify-end">
                                    <div class="w-48">
                                        <label class="text-[10px] text-slate-500 uppercase block font-bold mb-1">目前總損益 (TWD)</label>
                                        <input type="text" id="pnl-tw" class="input-field input-readonly w-full font-mono text-right text-sm" placeholder="--" readonly>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                <div>
                                    <label class="text-[10px] text-slate-500 mb-1 block uppercase font-bold">已投入本金 (TWD)</label>
                                    <div class="flex gap-2">
                                        <input type="number" id="input-tw" class="input-field font-mono" placeholder="請輸入本金" oninput="calculate()">
                                        <button onclick="quickAdd('input-tw', 50000)" class="btn-quick-add whitespace-nowrap px-4 font-semibold">+5萬</button>
                                    </div>
                                </div>
                                <div>
                                    <label class="text-[10px] text-amber-500 mb-1 block uppercase font-bold">台股目前市值 (TWD)</label>
                                    <input type="number" id="input-tw-market" class="input-field font-mono border-amber-500/30 text-amber-400" placeholder="輸入目前市值" oninput="calculate()">
                                </div>
                            </div>
                            <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden mt-2">
                                <div id="bar-tw" class="bg-purple-500 h-full transition-all duration-1000" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbYPyWLw2Da1goYFISnTpsSGfnuxNGEkhJIOU2iozNDQA7xnVROFjBM5rKj98foX0h/exec'; 
        let currentFxRate = 32.5;
        let assetHistory = []; 
        let currentTotalAssets = 0;
        
        // 核心修正：建立獨立的「歷史最高紀錄儲存欄位」（預設皆為空）
        let maxAssetRecord = { amount: 0, timestamp: '' };

        const emptyIfZero = (val) => (val == 0 || val === null || val === undefined) ? "" : val;

        async function fetchFxRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data?.rates?.TWD) {
                    currentFxRate = data.rates.TWD;
                    document.getElementById('fx-rate-display').innerText = currentFxRate.toFixed(2);
                    calculate();
                }
            } catch (e) {
                document.getElementById('fx-rate-display').innerText = "32.50 (估)";
            }
        }

        // 修改區塊：優化後的更新歷史紀錄與「永久歷史新高」UI 邏輯
        function updateHistoryUI() {
            const listContainer = document.getElementById('history-list');
            const highContainer = document.getElementById('high-record-display');

            // 1. 處理最近 10 筆歷史紀錄顯示
            if (!assetHistory || assetHistory.length === 0) {
                listContainer.innerHTML = '<span class="text-slate-600 text-[10px] italic">尚無歷史紀錄...</span>';
            } else {
                listContainer.innerHTML = assetHistory.map((item, index) => `
                    <div class="history-item flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-mono text-white font-bold">${Math.floor(item.amount).toLocaleString()} <span class="text-[8px] text-slate-500 ml-1 font-normal">TWD</span></span>
                            <span class="text-[9px] text-slate-500 font-mono">${item.timestamp}</span>
                        </div>
                        ${index === 0 ? '<span class="text-[8px] bg-blue-500/20 text-blue-400 px-1.5 py-0.5 rounded tracking-tighter">最新</span>' : ''}
                    </div>`).join('');
            }

            // 2. 進行最高紀錄的比對與顯示
            // 如果此時「當前實時資產」超越了資料庫中永久紀錄的最高金額
            const isCurrentTotalHigh = currentTotalAssets > maxAssetRecord.amount;
            
            // 決定畫面上要顯示的金額與時間資訊
            const displayAmount = isCurrentTotalHigh ? currentTotalAssets : maxAssetRecord.amount;
            const displayTime = isCurrentTotalHigh ? '✨ 刷新當前估算新高' : `📅 達標時間: ${maxAssetRecord.timestamp || '未紀錄'}`;

            if (displayAmount === 0) {
                highContainer.innerHTML = '<span class="text-slate-600 text-[10px] italic">暫無資產資料...</span>';
            } else {
                highContainer.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-xl font-mono text-amber-400 font-bold tracking-tight">
                            ${Math.floor(displayAmount).toLocaleString()} 
                            <span class="text-xs text-slate-500 ml-1 font-normal">TWD</span>
                        </span>
                        <span class="text-[10px] text-slate-400 font-mono mt-1">
                            ${displayTime}
                        </span>
                    </div>
                `;
            }

            // 3. 計算與上一次儲存的差值
            if (assetHistory.length > 0) {
                const lastSaved = assetHistory[0].amount;
                const diff = currentTotalAssets - lastSaved;
                const diffDisplay = document.getElementById('diff-display');
                if (diff > 0) {
                    diffDisplay.innerText = `+${Math.floor(diff).toLocaleString()}`;
                    diffDisplay.className = "text-sm font-mono mt-1 font-bold loss"; 
                } else if (diff < 0) {
                    diffDisplay.innerText = `${Math.floor(diff).toLocaleString()}`;
                    diffDisplay.className = "text-sm font-mono mt-1 font-bold profit"; 
                } else {
                    diffDisplay.innerText = "±0";
                    diffDisplay.className = "text-sm font-mono mt-1 font-bold text-slate-500";
                }
            }
        }

        function initSortable() {
            Sortable.create(document.getElementById('expense-list'), { animation: 150, handle: '.drag-handle', onEnd: () => calculate() });
            Sortable.create(document.getElementById('bank-list'), { animation: 150, handle: '.drag-handle', onEnd: () => calculate() });
        }

        function quickAdd(id, amount) {
            const input = document.getElementById(id);
            input.value = (parseFloat(input.value) || 0) + amount;
            calculate();
        }

        function addRow(type, name = '', amount = '') {
            const container = document.getElementById(type === 'bank' ? 'bank-list' : 'expense-list');
            const row = document.createElement('div');
            row.className = `flex gap-2 items-center ${type}-row bg-white/5 p-2 rounded-lg mb-1`;
            const nameClass = type === 'bank' ? 'bank-name' : 'exp-name';
            const amountClass = type === 'bank' ? 'bank-amount' : 'exp-amount';
            
            row.innerHTML = `
                <div class="drag-handle text-slate-600">⋮</div>
                <input type="text" class="input-field ${nameClass} text-xs" value="${name}" placeholder="${type === 'bank' ? '銀行名稱' : '項目'}">
                <input type="number" class="input-field ${amountClass} w-24 font-mono text-right text-xs" value="${emptyIfZero(amount)}" placeholder="金額" oninput="calculate()">
                <span class="btn-delete" onclick="this.parentElement.remove(); calculate();">✕</span>`;
            container.appendChild(row);
            calculate();
        }

        function calculateWithMarketValue() {
            const principal = parseFloat(document.getElementById('input-us-principal-usd').value) || 0;
            const marketValue = parseFloat(document.getElementById('input-us-market-usd').value) || 0;
            if (marketValue !== 0) {
                document.getElementById('pnl-us-usd').value = (marketValue - principal).toFixed(2);
            } else {
                document.getElementById('pnl-us-usd').value = "";
            }
            calculate();
        }

        function calculate() {
            // 銀行現金
            let totalBankCash = 0;
            document.querySelectorAll('.bank-amount').forEach(i => {
                const val = parseFloat(i.value);
                if (!isNaN(val)) totalBankCash += val;
            });
            document.getElementById('input-cash').value = totalBankCash === 0 ? "" : Math.floor(totalBankCash).toLocaleString();

            // 美股計算
            const usPrincipalUsd = parseFloat(document.getElementById('input-us-principal-usd').value) || 0;
            const usMarketValueUsd = parseFloat(document.getElementById('input-us-market-usd').value) || 0;
            const pnlUsUsd = usMarketValueUsd !== 0 ? (usMarketValueUsd - usPrincipalUsd) : 0;
            const usTotalValueTwd = usMarketValueUsd * currentFxRate;
            const usPnlTwd = pnlUsUsd * currentFxRate;
            
            document.getElementById('pnl-us-usd').value = usMarketValueUsd !== 0 ? pnlUsUsd.toFixed(2) : "";
            document.getElementById('pnl-us-twd-val').value = usMarketValueUsd !== 0 ? Math.floor(usPnlTwd).toLocaleString() : "";
            document.getElementById('pnl-us-twd-val').className = `input-field input-readonly w-28 font-mono text-right text-sm ${usPnlTwd >= 0 ? 'loss' : 'profit'}`;
            document.getElementById('pnl-us-twd-display').innerText = usTotalValueTwd === 0 ? "--" : Math.floor(usTotalValueTwd).toLocaleString();
            document.getElementById('pnl-us-twd-display').className = `text-lg font-mono font-bold ${usPnlTwd >= 0 ? 'loss' : 'profit'}`;

            // 台股計算
            const twPrincipal = parseFloat(document.getElementById('input-tw').value) || 0;
            const twMarket = parseFloat(document.getElementById('input-tw-market').value) || 0;
            const twPnl = twMarket !== 0 ? (twMarket - twPrincipal) : 0;
            document.getElementById('pnl-tw').value = twMarket !== 0 ? twPnl.toLocaleString() : "";
            document.getElementById('pnl-tw').className = `input-field input-readonly w-full font-mono text-right text-sm ${twPnl >= 0 ? 'loss' : 'profit'}`;

            // 總資產
            currentTotalAssets = totalBankCash + twMarket + usTotalValueTwd;
            document.getElementById('total-assets-display').innerText = currentTotalAssets === 0 ? "--" : Math.floor(currentTotalAssets).toLocaleString();
            
            // 觸發 UI 試算比對
            updateHistoryUI();

            // 進度條與收支彙整邏輯
            const targetUs = parseFloat(document.getElementById('target-us').value) || 2800000;
            const targetTw = parseFloat(document.getElementById('target-tw').value) || 3990000;
            document.getElementById('bar-us').style.width = Math.min(((usPrincipalUsd * currentFxRate) / targetUs) * 100, 100) + "%";
            document.getElementById('bar-tw').style.width = Math.min((twPrincipal / targetTw) * 100, 100) + "%";
            
            const income = parseFloat(document.getElementById('input-income').value) || 0;
            let totalExp = 0;
            document.querySelectorAll('.exp-amount').forEach(i => {
                const val = parseFloat(i.value);
                if (!isNaN(val)) totalExp += val;
            });
            document.getElementById('display-total-expense').value = totalExp === 0 ? "" : totalExp.toLocaleString();
            const balance = income - totalExp;
            const gapDisplay = document.getElementById('monthly-gap-display');
            gapDisplay.innerText = (balance > 0 ? "+" : "") + balance.toLocaleString();
            gapDisplay.className = `text-2xl font-mono font-bold ${balance >= 0 ? 'loss' : 'profit'}`;
        }

        async function saveData() {
            const status = document.getElementById('sync-status');
            const timeDisplay = document.getElementById('last-save-time');
            status.innerText = "正在儲存...";

            const now = new Date();
            const timeString = `${now.getFullYear()}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            // 修改區塊：在儲存前先對比。如果最新資產 > 資料庫的新高紀錄，才進行替換
            if (currentTotalAssets > maxAssetRecord.amount) {
                maxAssetRecord = {
                    amount: currentTotalAssets,
                    timestamp: timeString
                };
            }

            // 紀錄歷史資料，並保持最新 10 筆
            if (currentTotalAssets > 0) {
                assetHistory.unshift({
                    amount: currentTotalAssets,
                    timestamp: timeString
                });
                assetHistory = assetHistory.slice(0, 10);
            }

            const data = {
                lastSave: timeString,
                assetHistory: assetHistory, 
                maxAssetRecord: maxAssetRecord, // 核心修正：將永久新高紀錄傳回後端儲存
                income: document.getElementById('input-income').value,
                ammo: document.getElementById('input-ammo').value,
                travel: document.getElementById('input-travel').value,
                usPrincipalUsd: document.getElementById('input-us-principal-usd').value,
                usMarketUsd: document.getElementById('input-us-market-usd').value,
                tw: document.getElementById('input-tw').value,
                twMarket: document.getElementById('input-tw-market').value,
                targetUs: document.getElementById('target-us').value,
                targetTw: document.getElementById('target-tw').value,
                banks: Array.from(document.querySelectorAll('.bank-row')).map(r => ({
                    name: r.querySelector('.bank-name').value,
                    amount: r.querySelector('.bank-amount').value
                })),
                expenses: Array.from(document.querySelectorAll('.expense-row')).map(r => ({
                    name: r.querySelector('.exp-name').value,
                    amount: r.querySelector('.exp-amount').value
                }))
            };

            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                status.innerText = "已儲存";
                timeDisplay.innerText = `最後更新時間: ${timeString}`;
                updateHistoryUI(); 
                setTimeout(() => status.innerText = "系統連線中", 2000);
            } catch (e) { status.innerText = "儲存失敗"; }
        }

        async function loadData() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                if (data) {
                    assetHistory = data.assetHistory || [];
                    
                    // 核心修正：載入雲端儲存的永久歷史最高點紀錄
                    // 為了防止舊有的 GAS 資料中還沒有這個欄位，若無則從現有歷史中抓最大值初始化
                    if (data.maxAssetRecord) {
                        maxAssetRecord = data.maxAssetRecord;
                    } else if (assetHistory.length > 0) {
                        maxAssetRecord = assetHistory.reduce((max, item) => item.amount > max.amount ? item : max, assetHistory[0]);
                    }

                    document.getElementById('input-income').value = emptyIfZero(data.income);
                    document.getElementById('input-ammo').value = emptyIfZero(data.ammo);
                    document.getElementById('input-travel').value = emptyIfZero(data.travel);
                    document.getElementById('input-us-principal-usd').value = emptyIfZero(data.usPrincipalUsd);
                    document.getElementById('input-us-market-usd').value = emptyIfZero(data.usMarketUsd);
                    document.getElementById('input-tw').value = emptyIfZero(data.tw);
                    document.getElementById('input-tw-market').value = emptyIfZero(data.twMarket);
                    document.getElementById('target-us').value = data.targetUs || 2800000;
                    document.getElementById('target-tw').value = data.targetTw || 3990000;
                    
                    document.getElementById('bank-list').innerHTML = '';
                    if (data.banks?.length > 0) data.banks.forEach(b => addRow('bank', b.name, b.amount));
                    
                    document.getElementById('expense-list').innerHTML = '';
                    if (data.expenses?.length > 0) data.expenses.forEach(ex => addRow('expense', ex.name, ex.amount));
                    
                    updateHistoryUI(); 
                    calculateWithMarketValue(); 
                }
            } catch (e) { console.error("載入失敗", e); }
        }

        window.onload = () => { fetchFxRate(); loadData(); initSortable(); };
    </script>
</body>
</html>
